# Signs in, favourites a product, checks it survives a relaunch, then logs out.
# Covers the native modules through real screens: the Keychain (session
# restore), MMKV (favourites on disk), gestures (carousel swipe, image viewer)
# and deep links. Uses dummyjson's public test user.
# Run: maestro --udid <device> test .maestro/smoke.yaml
appId: com.faraz.foundation.dev
---
# clearState wipes app storage but, on iOS, not the Keychain, so starting on
# the login screen also proves the reinstall wipe.
- launchApp:
    clearState: true
# A debug build's first run waits for Metro to bundle from a cold cache.
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 180000
- tapOn:
    id: 'login-username'
- inputText: 'emilys'
- tapOn:
    id: 'login-password'
- inputText: 'emilyspass'
# Submits through the password field's "go" key. Maestro's hideKeyboard presses
# return on iOS, which would submit anyway, so this makes that path explicit.
# The button itself is covered by the Jest tests.
- pressKey: Enter
# iOS offers to save the password.
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible: 'Hi, Emily'
    timeout: 20000

# Products: the list loads from the network.
- tapOn:
    id: 'tab-products'
- extendedWaitUntil:
    visible:
      id: 'product-1'
    timeout: 20000
# Keeps queries from waiting out the toast's lifetime for the screen to settle.
- tapOn:
    id: 'favorite-1'
    waitToSettleTimeoutMs: 300
- assertVisible: 'Added to favourites'
- swipe:
    from:
      id: 'toast'
    direction: UP
    waitToSettleTimeoutMs: 300
- assertNotVisible: 'Added to favourites'

# Details: opened through its deep link. Product 6 has three images, so the
# carousel can be swiped before opening and closing the full-screen viewer.
- openLink: 'rn-foundation-dev://products/6'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'product-details'
    timeout: 20000
# Across the carousel by screen position: a swipe aimed at the list element
# did not page it on iOS.
- swipe:
    start: '85%, 35%'
    end: '10%, 35%'
    duration: 400
- assertVisible: '2 / 3'
- tapOn: 'Image 2 of 3.*'
- tapOn: 'Close'
- assertVisible:
    id: 'product-details'

# Favourites, reached through a deep link rather than the tab.
- openLink: 'rn-foundation-dev://favorites'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'product-1'
    timeout: 10000

# A relaunch restores the session from the Keychain and the favourite from MMKV.
- stopApp
- launchApp
- extendedWaitUntil:
    visible: 'Hi, Emily'
    timeout: 30000
- tapOn:
    id: 'tab-favorites'
- assertVisible:
    id: 'product-1'

# Settings, again through a deep link, then logout.
- openLink: 'rn-foundation-dev://settings'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'radio-dark'
    timeout: 10000
- tapOn:
    id: 'radio-dark'
- takeScreenshot: settings-dark
- tapOn:
    id: 'radio-system'
- tapOn:
    id: 'settings-logout'
- tapOn:
    id: 'logout-dialog-confirm'
- extendedWaitUntil:
    visible:
      id: 'login-submit'
    timeout: 10000
# Remember Me was on, so the username stays for the next sign-in.
- assertVisible: 'emilys'
