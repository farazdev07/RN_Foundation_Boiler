# Proves the native modules work on a device, including a real pan gesture.
# Run: maestro --udid <device> test .maestro/smoke.yaml
appId: com.faraz.foundation.dev
---
- launchApp
# A debug build's first run waits for Metro to bundle from a cold cache.
- extendedWaitUntil:
    visible: 'RN Foundation'
    timeout: 180000
- runFlow:
    when:
      visible: 'Not Now'
    commands:
      - tapOn: 'Not Now'
- extendedWaitUntil:
    visible: 'worklet: pass'
    timeout: 15000
- assertVisible: 'mmkv: pass'
- assertVisible: 'keychain: pass'
- assertVisible: 'netinfo: pass'
- assertVisible: 'gesture: pending'
- swipe:
    from:
      id: 'check-gesture-box'
    direction: RIGHT
- assertVisible: 'gesture: pass'
# The check screen pulses forever, so Maestro would otherwise wait out the
# toast's lifetime for the screen to settle.
- tapOn:
    text: 'Show toast'
    waitToSettleTimeoutMs: 300
- assertVisible: 'Swipe me up'
- swipe:
    from:
      id: 'toast'
    direction: UP
    waitToSettleTimeoutMs: 300
- assertNotVisible: 'Swipe me up'
- tapOn:
    id: 'tab-settings'
- tapOn:
    id: 'radio-dark'
- takeScreenshot: settings-dark
- tapOn:
    id: 'radio-system'
